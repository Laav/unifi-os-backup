name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    steps:
      - name: Install static analysis
        run: apt-get update && apt-get install -y git bash curl python3 coreutils findutils util-linux shellcheck systemd age
      - uses: actions/checkout@v5
      - name: Trust the checked-out workspace in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Bash tests
        run: bash tests/run.sh
      - name: Engine and real age tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: ShellCheck
        run: shellcheck install.sh update.sh uninstall.sh bin/* lib/*.sh tests/*.sh tests/fixtures/mock-*
      - name: Verify systemd units
        run: |
          install -m 0755 bin/* /usr/local/sbin/
          install -d -m 0755 /usr/local/lib/unifi-backup /var/lib/unifi-backup
          install -m 0644 lib/unifi-backup-common.sh /usr/local/lib/unifi-backup/common.sh
          install -m 0644 lib/unifi-backup-runtime.sh /usr/local/lib/unifi-backup/
          install -d -m 0755 /usr/local/lib/unifi-backup/ub
          install -m 0644 lib/ub/*.py /usr/local/lib/unifi-backup/ub/
          install -d -m 0700 /var/backups/unifi
          install -m 0644 systemd/* /etc/systemd/system/
          systemd-analyze verify /etc/systemd/system/unifi-backup*.service /etc/systemd/system/unifi-backup*.timer
