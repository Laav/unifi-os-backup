name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    steps:
      - uses: actions/checkout@v5
      - name: Install static analysis
        run: apt-get update && apt-get install -y bash curl python3 coreutils findutils util-linux shellcheck systemd
      - name: Bash tests
        run: bash tests/run.sh
      - name: ShellCheck
        run: shellcheck install.sh update.sh uninstall.sh bin/* lib/*.sh tests/*.sh tests/fixtures/mock-*
      - name: Verify systemd units
        run: |
          install -m 0755 bin/unifi-backup bin/unifi-backup-upload bin/unifi-backup-notify bin/unifi-backup-status bin/unifi-backup-monitor bin/unifi-backup-catalog bin/unifi-mail-backup /usr/local/sbin/
          install -d -m 0755 /usr/local/lib/unifi-backup /var/lib/unifi-backup
          install -m 0644 lib/unifi-backup-common.sh /usr/local/lib/unifi-backup/common.sh
          install -d -m 0700 /var/backups/unifi
          install -m 0644 systemd/unifi-backup.service systemd/unifi-backup.timer systemd/unifi-backup-monitor.service systemd/unifi-backup-monitor.timer /etc/systemd/system/
          systemd-analyze verify /etc/systemd/system/unifi-backup.service /etc/systemd/system/unifi-backup.timer /etc/systemd/system/unifi-backup-monitor.service /etc/systemd/system/unifi-backup-monitor.timer
